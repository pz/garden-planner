name: CI

# Typecheck, lint and unit tests on every PR and on main. (deploy.yml and pr-preview.yml only
# build; this is what actually runs the tests.)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc -b --noEmit
      - run: npm run lint
      - run: npm run test
