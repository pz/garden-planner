name: Deploy to GitHub Pages

# Publishes main to the root of the gh-pages branch, which GitHub Pages serves
# ("Deploy from a branch: gh-pages / root"). PR previews live beside it under
# pr-preview/ (see pr-preview.yml); this workflow never deletes that folder.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # push to gh-pages

concurrency:
  group: pages-main
  cancel-in-progress: true # only the newest main matters

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # Serve files as-is (no Jekyll processing).
      - run: touch dist/.nojekyll
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          # Replace the old site at the root, but leave open PR previews alone.
          clean: true
          clean-exclude: pr-preview/
